{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<h1>Cambiar contraseña</h1>
<p>Mínimo 8 caracteres, con letras y números.</p>
<form method="post" action="{{ url_for('perfil.cambiar_clave') }}" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="clave_actual">Contraseña actual</label>
  <input id="clave_actual" name="clave_actual" type="password" maxlength="128" required autocomplete="current-password">
  <label for="clave_nueva">Nueva contraseña</label>
  <input id="clave_nueva" name="clave_nueva" type="password" minlength="8" maxlength="128" required autocomplete="new-password">
  <label for="clave_confirmacion">Confirmar nueva contraseña</label>
  <input id="clave_confirmacion" name="clave_confirmacion" type="password" minlength="8" maxlength="128" required autocomplete="new-password">
  <button type="submit">Guardar</button>
</form>
{% endblock %}
