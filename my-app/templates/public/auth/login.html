{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<h1>Iniciar sesión</h1>
<form method="post" action="{{ url_for('auth.login') }}" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="cedula">Cédula</label>
  <input id="cedula" name="cedula" type="text" inputmode="numeric" maxlength="10"
         pattern="[0-9]{10}" value="{{ cedula or '' }}" required autofocus>
  <label for="clave">Contraseña</label>
  <input id="clave" name="clave" type="password" maxlength="128" required autocomplete="current-password">
  <button type="submit">Entrar</button>
</form>
{% endblock %}
